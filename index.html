const CORRECT_HASH = '8d5e4e7d8f2a9c3b1e6f8a2d4c7b9e1f3a5c7d8e9f0a1b2c3d4e5f6a7b8c9d0e';

let failCount = parseInt(localStorage.getItem('admin_failCount')) || 0;
let lockUntil = parseInt(localStorage.getItem('admin_lockUntil')) || 0;

async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword(inputPwd) {
    if (lockUntil > Date.now()) {
        const remaining = Math.ceil((lockUntil - Date.now()) / 60000);
        document.getElementById('lockMsg').style.display = 'block';
        document.getElementById('lockMsg').textContent = '⛔ 错误次数过多，请等待 ' + remaining + ' 分钟后重试';
        document.getElementById('errorMsg').textContent = '';
        return false;
    } else {
        document.getElementById('lockMsg').style.display = 'none';
    }

    const inputHash = await sha256(inputPwd);

    if (inputHash === CORRECT_HASH) {
        failCount = 0;
        localStorage.setItem('admin_failCount', '0');
        document.getElementById('errorMsg').textContent = '';
        document.getElementById('lockMsg').style.display = 'none';
        return true;
    } else {
        failCount++;
        localStorage.setItem('admin_failCount', String(failCount));

        if (failCount >= 5) {
            lockUntil = Date.now() + 5 * 60 * 1000;
            localStorage.setItem('admin_lockUntil', String(lockUntil));
            document.getElementById('lockMsg').style.display = 'block';
            document.getElementById('lockMsg').textContent = '⛔ 错误次数过多，请等待 5 分钟后重试';
            document.getElementById('errorMsg').textContent = '';
        } else {
            document.getElementById('errorMsg').textContent = '❌ 密码错误，还剩 ' + (5 - failCount) + ' 次机会';
            document.getElementById('lockMsg').style.display = 'none';
        }
        return false;
    }
}

async function loadHistory() {
    try {
        const { data, error } = await supabase
            .from('comments')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

        if (error) {
            console.error('加载失败:', error);
            return;
        }

        if (data && data.length > 0) {
            const comments = data.slice(0, 30);
            comments.forEach((item, index) => {
                setTimeout(() => {
                    addDanmaku(item.content, item.display_number, item.id);
                }, index * 400);
            });
            countDisplay.textContent = data.length;
        }
    } catch (err) {
        console.error('网络错误:', err);
    }
}

async function postComment() {
    const text = input.value.trim();
    if (!text) {
        alert('请输入内容');
        return;
    }

    try {
        const { data, error } = await supabase
            .from('comments')
            .insert([{ content: text }])
            .select();

        if (error) {
            console.error('发布失败:', error);
            alert('发布失败，请重试');
            return;
        }

        input.value = '';
        if (data && data.length > 0) {
            const item = data[0];
            addDanmaku(item.content, item.display_number, item.id);
            const count = parseInt(countDisplay.textContent) + 1;
            countDisplay.textContent = count;
        }
    } catch (err) {
        console.error('网络错误:', err);
        alert('网络异常，请重试');
    }
}

async function reportComment(id) {

    try {
        const { error } = await supabase
            .from('comments')
            .update({
                is_reported: true,
                report_count: 1,
                report_reason: reason,
                reported_at: new Date().toISOString(),
                reporter_id: USER_ID

            .eq('id', id);

            alert('举报失败，请重试');

}

function addDanmaku(text, number, id) {
    let row = -1;
    for (let attempt = 0; attempt < 20; attempt++) {
        const candidate = Math.floor(Math.random() * ROWS);
        if (!rowOccupied[candidate]) {
            row = candidate;
            break;
        }
    }
    if (row === -1) {
        for (let i = 0; i < ROWS; i++) {
            if (!rowOccupied[i]) { row = i; break; }
        }
    }
    if (row === -1) row = Math.floor(Math.random() * ROWS);
    rowOccupied[row] = true;

    const el = document.createElement('div');
    el.className = 'danmaku-item color-' + (Math.floor(Math.random() * 5) + 1);
    el.style.top = (row * ITEM_HEIGHT + 10) + 'px';
    el.style.left = '100%';

    const badge = document.createElement('span');
    badge.className = 'number-badge';
    badge.textContent = '#' + String(number || '???').padStart(3, '0');
    el.appendChild(badge);

    const contentSpan = document.createElement('span');
    contentSpan.textContent = text;
    el.appendChild(contentSpan);

    const reportBtn = document.createElement('button');
    reportBtn.className = 'report-btn';
    reportBtn.textContent = '举报';
    reportBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (id) reportComment(id);
    });
    el.appendChild(reportBtn);

    stage.appendChild(el);
    const startX = stage.clientWidth;

    function animate() {
        const currentX = parseFloat(el.style.left) || startX;
        const newX = currentX - 0.8;
        el.style.left = newX + 'px';
        if (newX > -el.offsetWidth - 20) {
            requestAnimationFrame(animate);
        } else {
            el.remove();
            rowOccupied[row] = false;
        }
    }
    setTimeout(animate, 100);
}

postBtn.addEventListener('click', postComment);
input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') postComment();
});

// ============================================================
// 9. 管理后台功能
// ============================================================
async function loadAdminComments() {
    try {
        const { data, error } = await supabase
            .from('comments')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('加载失败:', error);
            return;
        }

        allComments = data || [];
        updateAdminStats();
        renderAdminComments();
    } catch (err) {
        console.error('网络错误:', err);
    }
}

function updateAdminStats() {
    const total = allComments.length;
    const reported = allComments.filter(function(c) { return c.is_reported; }).length;
    const normal = total - reported;

    totalCount.textContent = total;
    reportedCount.textContent = reported;
    normalCount.textContent = normal;
}

function renderAdminComments() {
    if (allComments.length === 0) {
        adminCommentList.innerHTML = '<div class="no-comments">📭 暂无评论</div>';
        return;
    }

    adminCommentList.innerHTML = allComments.map(function(item) {
        var time = new Date(item.created_at).toLocaleString('zh-CN');
        var isReported = item.is_reported;
        var reportedClass = isReported ? 'reported' : '';
        var reportBadge = isReported ? '🚨 已举报' : '正常';
        var reportReason = isReported && item.report_reason ? '📢 ' + item.report_reason : '';
        var reporterId = isReported && item.reporter_id ? '举报人: ' + item.reporter_id : '';

        return '<div class="admin-comment-item ' + reportedClass + '">' +
            '<span class="ac-content">#' + String(item.display_number || '???').padStart(3, '0') + ' ' + escapeHtml(item.content) + '</span>' +
            '<span class="ac-meta">' + time + ' ' + reportBadge + ' ' + reportReason + ' ' + reporterId + '</span>' +
            '<div class="ac-actions">' +
            (isReported ? '<button class="btn-unreport" onclick="unreportComment(' + item.id + ')">✅</button>' : '') +
            '<button class="btn-edit" onclick="editComment(' + item.id + ')">✏️</button>' +
            '<button class="btn-delete" onclick="deleteComment(' + item.id + ')">🗑️</button>' +
            '</div>' +
            '</div>';
    }).join('');
}

function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function deleteComment(id) {
    if (!confirm('确定要删除这条评论吗？')) return;

    var { error } = await supabase
        .from('comments')
        .delete()
        .eq('id', id);

    if (error) {
        alert('删除失败，请重试');
        return;
    }

    loadAdminComments();
}

async function unreportComment(id) {
    if (!confirm('确认已核实并处理该举报？')) return;

    var { error } = await supabase
        .from('comments')
        .update({
            is_reported: false,
            report_count: 0,
            report_reason: null
        })
        .eq('id', id);

    if (error) {
        alert('操作失败，请重试');
        return;
    }

    loadAdminComments();
}

async function editComment(id) {
    var item = allComments.find(function(c) { return c.id === id; });
    if (!item) return;

    var newContent = prompt('修改评论内容：', item.content);
    if (newContent === null) return;
    if (!newContent.trim()) {
        alert('内容不能为空');
        return;
    }

    var { error } = await supabase
        .from('comments')
        .update({ content: newContent.trim() })
        .eq('id', id);

    if (error) {
        alert('修改失败，请重试');
        return;
    }

    loadAdminComments();
}

// 把函数暴露到全局（给 onclick 用）
window.deleteComment = deleteComment;
window.unreportComment = unreportComment;
window.editComment = editComment;
